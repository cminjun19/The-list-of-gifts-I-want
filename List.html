<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>선물 목록</title>
<style>
  @font-face {
    font-family: 'Jalnan2';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2107@1.1/Jalnan2.woff') format('woff');
    font-weight: normal;
    font-style: normal;
  }
</style>
<style>
  :root {
    --bg: #fdfaf6;
    --ink: #2b2521;
    --accent: #4a6b5a;
    --accent-light: #dce9e1;
    --card: #ffffff;
    --border: #e6ddd2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Malgun Gothic", sans-serif;
  }

  /* 헤더 (index.html과 동일) */
  header {
    background: linear-gradient(to bottom, #b3b0ab, #d9d6d0);
    padding: 18px 32px;
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 20px;
  }
  .logo {
    width: 56px;
    height: 56px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 56px;
  }
  header h1 {
    margin: 0;
    font-family: "Jalnan2", sans-serif;
    font-size: 40px;
    font-weight: 400;
    text-align: center;
    letter-spacing: -0.5px;
  }
  .auth-links {
    font-size: 15px;
    font-weight: 600;
    color: #2b2521;
    white-space: nowrap;
  }
  .auth-links span { color: #4a4540; margin: 0 6px; }

  /* 탭 (index.html과 동일) */
  nav {
    background: #dedbd5;
    padding: 12px 32px;
    display: flex;
    justify-content: center;
    gap: 320px;
  }
  .tab-btn {
    background: none;
    border: none;
    padding: 0;
    font-family: "Jalnan2", sans-serif;
    font-size: 20px;
    font-weight: 400;
    color: var(--ink);
    text-decoration: none;
  }
  .tab-btn.active {
    text-decoration: underline;
    text-underline-offset: 6px;
  }

  /* 선물 목록 전용 화면 */
  main {
    max-width: 760px;
    margin: 0 auto;
    padding: 48px 20px 80px;
  }
  main h2 {
    font-family: "Jalnan2", sans-serif;
    font-weight: 400;
    font-size: 28px;
    margin: 0 0 24px;
  }
  .debug-banner {
    background: #f8d7da;
    color: #842029;
    font-size: 13px;
    padding: 10px 16px;
    border-radius: 8px;
    margin-bottom: 16px;
    display: none;
    white-space: pre-wrap;
  }
  .gift-row {
    display: flex;
    align-items: center;
    gap: 16px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 20px;
    margin-bottom: 10px;
  }
  .gift-row-title {
    flex: 2;
    font-size: 16px;
    font-weight: 600;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .gift-row-price {
    flex: 1;
    font-size: 14px;
    color: #8a8078;
  }
  .gift-row-date {
    flex: 1;
    font-size: 13px;
    color: #b0a99c;
  }
  .status-toggle {
    font-size: 12px;
    font-weight: 700;
    padding: 5px 12px;
    border-radius: 999px;
    border: none;
    cursor: pointer;
    flex-shrink: 0;
  }
  .status-toggle.checked {
    background: var(--accent-light);
    color: var(--accent);
  }
  .status-toggle.unchecked {
    background: #f3ede3;
    color: #a89e93;
  }
  .empty-msg {
    text-align: center;
    color: #b0a99c;
    font-size: 14px;
    padding: 40px 0;
  }
</style>
</head>
<body>

  <header>
    <a class="logo" href="index.html" style="text-decoration: none;">🎁</a>
    <h1>내가 원하는 선물 목록</h1>
    <div class="auth-links"><a href="login.html" style="color: inherit; text-decoration: none;">로그인</a> <span>|</span> <a href="login.html" style="color: inherit; text-decoration: none;">회원가입</a></div>
  </header>

  <nav>
    <a class="tab-btn" href="add.html">선물 목록 추가</a>
    <a class="tab-btn active" href="list.html">선물 목록</a>
    <a class="tab-btn" href="notice.html">공지사항</a>
  </nav>

  <main>
    <h2>선물 목록</h2>

    <div class="debug-banner" id="debugBanner"></div>

    <div id="giftList"></div>
    <p class="empty-msg" id="emptyMsg" style="display: none;">아직 등록된 선물이 없어요</p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://ucczbdnlsqsrbbbwecun.supabase.co";
    const SUPABASE_KEY = "sb_publishable_hEmL8pki9XjAN0nTb_Yp4w_aq42VcNa";
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const giftList = document.getElementById("giftList");
    const emptyMsg = document.getElementById("emptyMsg");
    const debugBanner = document.getElementById("debugBanner");

    function showError(label, error) {
      debugBanner.style.display = "block";
      debugBanner.textContent = label + ": " + (error.message || JSON.stringify(error));
    }

    function renderGifts(gifts) {
      giftList.innerHTML = "";

      if (gifts.length === 0) {
        emptyMsg.style.display = "block";
        return;
      }
      emptyMsg.style.display = "none";

      gifts.forEach((gift) => {
        const row = document.createElement("div");
        row.className = "gift-row";

        const titleEl = document.createElement("div");
        titleEl.className = "gift-row-title";
        titleEl.textContent = gift.title;

        const priceEl = document.createElement("div");
        priceEl.className = "gift-row-price";
        priceEl.textContent = gift.price || "";

        const dateEl = document.createElement("div");
        dateEl.className = "gift-row-date";
        if (gift.created_at) {
          const d = new Date(gift.created_at);
          dateEl.textContent = `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, "0")}.${String(d.getDate()).padStart(2, "0")}`;
        }

        const statusBtn = document.createElement("button");
        statusBtn.type = "button";
        statusBtn.className = "status-toggle " + (gift.checked ? "checked" : "unchecked");
        statusBtn.textContent = gift.checked ? "확인함" : "미확인";
        statusBtn.addEventListener("click", () => toggleChecked(gift));

        row.appendChild(titleEl);
        row.appendChild(priceEl);
        row.appendChild(dateEl);
        row.appendChild(statusBtn);
        giftList.appendChild(row);
      });
    }

    async function loadGifts() {
      const { data, error } = await sb
        .from("gifts")
        .select("*")
        .order("created_at", { ascending: false });

      if (error) {
        showError("불러오기 실패", error);
        return;
      }
      renderGifts(data);
    }

    async function toggleChecked(gift) {
      const { error } = await sb
        .from("gifts")
        .update({ checked: !gift.checked })
        .eq("id", gift.id);

      if (error) {
        showError("상태 변경 실패", error);
        return;
      }
      loadGifts();
    }

    loadGifts();
  </script>

</body>
</html>
