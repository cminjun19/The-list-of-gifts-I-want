<!DOCTYPE html> 
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>선물 목록 추가</title>
<style>
  @font-face {
    font-family: 'Jalnan2';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2107@1.1/Jalnan2.woff') format('woff');
    font-weight: normal;
    font-style: normal;
  }
</style>
<style>
  :root {
    --bg: #fdfaf6;
    --ink: #2b2521;
    --accent: #4a6b5a;
    --accent-light: #dce9e1;
    --card: #ffffff;
    --border: #e6ddd2;
    --header-bg: #f3ede3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Malgun Gothic", sans-serif;
  }

  /* 헤더 (index.html과 동일) */
  header {
    background: linear-gradient(to bottom, #b3b0ab, #d9d6d0);
    padding: 18px 32px;
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 20px;
  }
  .logo {
    width: 56px;
    height: 56px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 56px;
  }
  header h1 {
    margin: 0;
    font-family: "Jalnan2", sans-serif;
    font-size: 40px;
    font-weight: 400;
    text-align: center;
    letter-spacing: -0.5px;
  }
  .auth-links {
    font-size: 15px;
    font-weight: 600;
    color: #2b2521;
    white-space: nowrap;
  }
  .auth-links span {
    color: #4a4540;
    margin: 0 6px;
  }

  /* 탭 (index.html과 동일) */
  nav {
    background: #dedbd5;
    padding: 12px 32px;
    display: flex;
    justify-content: center;
    gap: 320px;
  }
  .tab-btn {
    background: none;
    border: none;
    padding: 0;
    font-family: "Jalnan2", sans-serif;
    font-size: 20px;
    font-weight: 400;
    color: var(--ink);
    text-decoration: none;
  }
  .tab-btn.active {
    text-decoration: underline;
    text-underline-offset: 6px;
  }

  /* 여기부터는 "선물 목록 추가" 화면 전용 내용 */
  main {
    max-width: 560px;
    margin: 0 auto;
    padding: 56px 20px 80px;
  }
  main h2 {
    font-family: "Jalnan2", sans-serif;
    font-weight: 400;
    font-size: 28px;
    margin: 0 0 8px;
  }
  main > p.desc {
    color: #8a8078;
    font-size: 14px;
    margin: 0 0 32px;
  }
  .debug-banner {
    background: #f8d7da;
    color: #842029;
    font-size: 13px;
    padding: 10px 16px;
    border-radius: 8px;
    margin-bottom: 16px;
    display: none;
    white-space: pre-wrap;
  }
  .add-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 32px;
  }
  form {
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .field label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #6b6259;
    margin-bottom: 6px;
  }
  .field input {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 14px;
    background: var(--bg);
    font-family: inherit;
    color: var(--ink);
  }
  .field input:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  .submit-btn {
    margin-top: 8px;
    font-family: "Jalnan2", sans-serif;
    font-size: 17px;
    font-weight: 400;
    background: var(--accent);
    color: white;
    border: none;
    padding: 15px;
    border-radius: 12px;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(74, 107, 90, 0.25);
  }
  .submit-btn:hover { opacity: 0.92; }
  .success-msg {
    text-align: center;
    color: var(--accent);
    font-size: 14px;
    margin-top: 16px;
    display: none;
  }
</style>
</head>
<body>

  <header>
    <a class="logo" href="index.html" style="text-decoration: none;">🎁</a>
    <h1>내가 원하는 선물 목록</h1>
    <div class="auth-links"><a href="login.html" style="color: inherit; text-decoration: none;">로그인</a> <span>|</span> <a href="login.html" style="color: inherit; text-decoration: none;">회원가입</a></div>
  </header>

  <nav>
    <a class="tab-btn active" href="add.html">선물 목록 추가</a>
    <a class="tab-btn" href="list.html">선물 목록</a>
    <a class="tab-btn" href="notice.html">공지사항</a>
  </nav>

  <main>
    <h2>선물 추가하기</h2>
    <p class="desc">받고 싶은 선물 정보를 입력해주세요</p>

    <div class="debug-banner" id="debugBanner"></div>

    <div class="add-card">
      <form id="giftForm">
        <div class="field">
          <label for="title">선물 이름</label>
          <input type="text" id="title" placeholder="예: 무선 이어폰" required />
        </div>

        <div class="field">
          <label for="price">가격</label>
          <input type="text" id="price" placeholder="예: 150,000원" />
        </div>

        <button type="submit" class="submit-btn">선물 목록에 추가</button>
        <p class="success-msg" id="successMsg">추가됐어요! 홈이나 선물 목록에서 확인해보세요.</p>
      </form>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://ucczbdnlsqsrbbbwecun.supabase.co";
    const SUPABASE_KEY = "sb_publishable_hEmL8pki9XjAN0nTb_Yp4w_aq42VcNa";
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const giftForm = document.getElementById("giftForm");
    const debugBanner = document.getElementById("debugBanner");
    const successMsg = document.getElementById("successMsg");

    function showError(label, error) {
      debugBanner.style.display = "block";
      debugBanner.textContent = label + ": " + (error.message || JSON.stringify(error));
    }

    giftForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const title = document.getElementById("title").value.trim();
      const price = document.getElementById("price").value.trim();
      if (!title) return;

      const { error } = await sb.from("gifts").insert([{ title, price, checked: false }]);

      if (error) {
        showError("추가 실패", error);
        return;
      }

      giftForm.reset();
      debugBanner.style.display = "none";
      successMsg.style.display = "block";
    });
  </script>

</body>
</html>
