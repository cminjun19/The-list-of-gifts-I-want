<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>내가 원하는 선물 목록</title>
<style>
  @font-face {
    font-family: 'Jalnan2';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2107@1.1/Jalnan2.woff') format('woff');
    font-weight: normal;
    font-style: normal;
  }
</style>
<style>
  :root {
    --bg: #fdfaf6;
    --ink: #2b2521;
    --accent: #4a6b5a;
    --accent-light: #dce9e1;
    --card: #ffffff;
    --border: #e6ddd2;
    --header-bg: #f3ede3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Malgun Gothic", sans-serif;
  }

  /* 헤더 */
  header {
    background: linear-gradient(to bottom, #b3b0ab, #d9d6d0);
    padding: 18px 32px;
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 20px;
  }
  .logo {
    width: 56px;
    height: 56px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 56px;
  }
  header h1 {
    margin: 0;
    font-family: "Jalnan2", sans-serif;
    font-size: 40px;
    font-weight: 400;
    text-align: center;
    letter-spacing: -0.5px;
  }
  .auth-links {
    font-size: 15px;
    font-weight: 600;
    color: #2b2521;
    white-space: nowrap;
  }
  .auth-links span {
    color: #4a4540;
    margin: 0 6px;
  }

  /* 탭 (링크 없이 표시만) */
  nav {
    background: #dedbd5;
    padding: 12px 32px;
    display: flex;
    justify-content: center;
    gap: 320px;
  }
  .tab-btn {
    background: none;
    border: none;
    padding: 0;
    font-family: "Jalnan2", sans-serif;
    font-size: 20px;
    font-weight: 400;
    color: var(--ink);
    cursor: default;
  }

  /* 콘텐츠 영역 */
  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 32px 20px;
  }
  /* 히어로 영역 */
  .hero {
    text-align: center;
    padding: 56px 20px 48px;
  }
  .hero-icon {
    font-size: 48px;
    margin-bottom: 16px;
  }
  .hero h2 {
    font-family: "Jalnan2", sans-serif;
    font-weight: 400;
    font-size: 26px;
    margin: 0 0 12px;
    color: var(--ink);
  }
  .hero p {
    color: #8a8078;
    font-size: 15px;
    margin: 0 0 28px;
    line-height: 1.6;
  }
  .hero-cta {
    font-family: "Jalnan2", sans-serif;
    font-size: 16px;
    font-weight: 400;
    background: var(--accent);
    color: white;
    border: none;
    padding: 14px 32px;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(74, 107, 90, 0.25);
  }
  .hero-cta:hover {
    opacity: 0.92;
  }

  /* 홈 2단 레이아웃 (좌: 선물 목록 요약 / 우: 공지사항 요약) */
  .home-grid {
    padding: 48px 32px 80px;
    max-width: 1100px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 36px;
  }
  .panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 36px;
    display: flex;
    flex-direction: column;
  }
  .panel-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 24px;
  }
  .panel-header h3 {
    font-family: "Jalnan2", sans-serif;
    font-weight: 400;
    font-size: 28px;
    margin: 0;
  }
  .panel-more {
    font-size: 16px;
    font-weight: 600;
    color: var(--accent);
    text-decoration: none;
    white-space: nowrap;
  }

  /* 선물 목록 미니 항목 */
  .mini-gift {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 18px 0;
    border-bottom: 1px solid var(--border);
  }
  .mini-gift:last-child { border-bottom: none; }
  .mini-gift-thumb {
    width: 60px;
    height: 60px;
    border-radius: 14px;
    background: var(--accent-light);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    flex-shrink: 0;
  }
  .mini-gift-info {
    flex: 1;
    min-width: 0;
  }
  .mini-gift-title {
    font-size: 19px;
    font-weight: 600;
    margin: 0 0 3px;
  }
  .mini-gift-price {
    font-size: 16px;
    color: #a89e93;
    margin: 0;
  }
  .mini-badge {
    font-size: 13px;
    font-weight: 700;
    padding: 6px 14px;
    border-radius: 999px;
    flex-shrink: 0;
  }
  .mini-badge.checked {
    background: var(--accent-light);
    color: var(--accent);
  }
  .mini-badge.unchecked {
    background: #f3ede3;
    color: #a89e93;
  }

  /* 공지사항 미니 항목 */
  .mini-notice {
    padding: 18px 0;
    border-bottom: 1px solid var(--border);
  }
  .mini-notice:last-child { border-bottom: none; }
  .mini-notice-title {
    font-size: 19px;
    font-weight: 600;
    margin: 0 0 5px;
  }
  .mini-notice-date {
    font-size: 15px;
    color: #a89e93;
    margin: 0;
  }

  /* 선물 목록 */
  .gift-list-section {
    max-width: 1100px;
    margin: 0;
    padding: 20px 20px 64px;
  }
  .gift-list-section h2 {
    font-family: "Jalnan2", sans-serif;
    font-weight: 400;
    font-size: 28px;
    margin: 0 0 24px;
  }
  .gift-list-frame {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    aspect-ratio: 3 / 2;
    width: 600px;
    max-width: 100%;
    padding: 20px;
  }
  .gift-list-inner {
    width: 100%;
    height: 100%;
    display: grid;
    grid-template-rows: repeat(5, 1fr);
    gap: 10px;
  }
  .gift-list-slot {
    border: 1px dashed var(--border);
    border-radius: 10px;
    display: grid;
    grid-template-columns: 8fr 5fr 3fr;
    padding: 8px;
  }
  .gift-list-cell {
    border-right: 1px dashed var(--border);
  }
  .gift-list-cell:last-child {
    border-right: none;
  }
  .no-divider .gift-list-cell {
    border-right: 1px dashed var(--border);
  }
  .no-divider .gift-list-cell:last-child {
    border-right: none;
  }
  .no-divider .gift-list-slot {
    grid-template-columns: 1fr 7fr;
  }

  /* 친구들의 위시리스트 */
  .friends-section {
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 32px 64px;
  }
  .friends-section h3 {
    font-family: "Jalnan2", sans-serif;
    font-weight: 400;
    font-size: 28px;
    margin: 0 0 20px;
  }
  .friends-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
  }
  .friend-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 22px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .friend-avatar {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: var(--accent-light);
    color: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Jalnan2", sans-serif;
    font-size: 18px;
    flex-shrink: 0;
  }
  .friend-info {
    flex: 1;
    min-width: 0;
  }
  .friend-name {
    font-size: 17px;
    font-weight: 700;
    margin: 0 0 3px;
  }
  .friend-count {
    font-size: 14px;
    color: #a89e93;
    margin: 0;
  }

  /* 상단 좌우 배치 */
  .top-row {
    display: flex;
    justify-content: center;
    gap: 24px;
  }

  /* 선물 추가 폼 */
  .add-form {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  .add-form input {
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 13px;
    font-family: inherit;
    background: var(--bg);
  }
  .add-form input[name="title"] { flex: 2; min-width: 0; }
  .add-form input[name="price"] { flex: 1; min-width: 0; }
  .add-form button {
    font-family: "Jalnan2", sans-serif;
    font-size: 13px;
    font-weight: 400;
    background: var(--accent);
    color: white;
    border: none;
    padding: 0 14px;
    border-radius: 8px;
    cursor: pointer;
  }
  .add-form button:hover { opacity: 0.9; }

  /* 선물 목록 실데이터 표시용 */
  .gift-list-slot .cell-title {
    padding: 0 10px;
    display: flex;
    align-items: center;
    font-size: 14px;
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .gift-list-slot .cell-price {
    padding: 0 10px;
    display: flex;
    align-items: center;
    font-size: 13px;
    color: #8a8078;
  }
  .gift-list-slot .cell-status {
    padding: 0 10px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .status-toggle {
    font-size: 11px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 999px;
    border: none;
    cursor: pointer;
  }
  .status-toggle.checked {
    background: var(--accent-light);
    color: var(--accent);
  }
  .status-toggle.unchecked {
    background: #f3ede3;
    color: #a89e93;
  }
  .debug-banner {
    background: #f8d7da;
    color: #842029;
    font-size: 13px;
    padding: 10px 16px;
    border-radius: 8px;
    margin-bottom: 12px;
    display: none;
    white-space: pre-wrap;
  }
</style>
</head>
<body>

  <header>
    <span class="logo">🎁</span>
    <h1>내가 원하는 선물 목록</h1>
    <div class="auth-links">로그인 <span>|</span> 회원가입</div>
  </header>

  <nav>
    <span class="tab-btn">선물 목록 추가</span>
    <span class="tab-btn">선물 목록</span>
    <span class="tab-btn">공지사항</span>
  </nav>

  <main>
    <div class="top-row">
      <section class="gift-list-section">
        <h2>선물 목록</h2>

        <div class="debug-banner" id="debugBanner"></div>

        <form class="add-form" id="giftForm">
          <input type="text" name="title" placeholder="선물 이름" required />
          <input type="text" name="price" placeholder="가격" />
          <button type="submit">추가</button>
        </form>

        <div class="gift-list-frame">
          <div class="gift-list-inner" id="giftListInner">
            <div class="gift-list-slot">
              <div class="gift-list-cell"></div>
              <div class="gift-list-cell"></div>
              <div class="gift-list-cell"></div>
            </div>
            <div class="gift-list-slot">
              <div class="gift-list-cell"></div>
              <div class="gift-list-cell"></div>
              <div class="gift-list-cell"></div>
            </div>
            <div class="gift-list-slot">
              <div class="gift-list-cell"></div>
              <div class="gift-list-cell"></div>
              <div class="gift-list-cell"></div>
            </div>
            <div class="gift-list-slot">
              <div class="gift-list-cell"></div>
              <div class="gift-list-cell"></div>
              <div class="gift-list-cell"></div>
            </div>
            <div class="gift-list-slot">
              <div class="gift-list-cell"></div>
              <div class="gift-list-cell"></div>
              <div class="gift-list-cell"></div>
            </div>
          </div>
        </div>
      </section>

      <section class="gift-list-section no-divider">
        <h2>공지사항</h2>
        <div class="gift-list-frame">
          <div class="gift-list-inner">
            <div class="gift-list-slot">
              <div class="gift-list-cell"></div>
              <div class="gift-list-cell"></div>
            </div>
            <div class="gift-list-slot">
              <div class="gift-list-cell"></div>
              <div class="gift-list-cell"></div>
            </div>
            <div class="gift-list-slot">
              <div class="gift-list-cell"></div>
              <div class="gift-list-cell"></div>
            </div>
            <div class="gift-list-slot">
              <div class="gift-list-cell"></div>
              <div class="gift-list-cell"></div>
            </div>
            <div class="gift-list-slot">
              <div class="gift-list-cell"></div>
              <div class="gift-list-cell"></div>
            </div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <!-- Supabase 연동 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://ucczbdnlsqsrbbbwecun.supabase.co";
    const SUPABASE_KEY = "sb_publishable_hEmL8pki9XjAN0nTb_Yp4w_aq42VcNa";
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const giftListInner = document.getElementById("giftListInner");
    const giftForm = document.getElementById("giftForm");
    const debugBanner = document.getElementById("debugBanner");

    function showError(label, error) {
      debugBanner.style.display = "block";
      debugBanner.textContent = label + ": " + (error.message || JSON.stringify(error));
    }

    function renderGifts(gifts) {
      giftListInner.innerHTML = "";

      // 최대 5개까지만 화면에 보여줌 (틀이 5줄이라)
      const rows = gifts.slice(0, 5);

      rows.forEach((gift) => {
        const slot = document.createElement("div");
        slot.className = "gift-list-slot";

        const titleCell = document.createElement("div");
        titleCell.className = "cell-title";
        titleCell.textContent = gift.title;

        const priceCell = document.createElement("div");
        priceCell.className = "cell-price";
        priceCell.textContent = gift.price || "";

        const statusCell = document.createElement("div");
        statusCell.className = "cell-status";
        const statusBtn = document.createElement("button");
        statusBtn.type = "button";
        statusBtn.className = "status-toggle " + (gift.checked ? "checked" : "unchecked");
        statusBtn.textContent = gift.checked ? "확인함" : "미확인";
        statusBtn.addEventListener("click", () => toggleChecked(gift));
        statusCell.appendChild(statusBtn);

        slot.appendChild(titleCell);
        slot.appendChild(priceCell);
        slot.appendChild(statusCell);
        giftListInner.appendChild(slot);
      });

      // 남는 줄은 빈 틀로 채움
      for (let i = rows.length; i < 5; i++) {
        const emptySlot = document.createElement("div");
        emptySlot.className = "gift-list-slot";
        emptySlot.innerHTML =
          '<div class="gift-list-cell"></div><div class="gift-list-cell"></div><div class="gift-list-cell"></div>';
        giftListInner.appendChild(emptySlot);
      }
    }

    async function loadGifts() {
      const { data, error } = await sb
        .from("gifts")
        .select("*")
        .order("created_at", { ascending: false });

      if (error) {
        console.error("불러오기 실패:", error.message, error.details, error.hint, error.code);
        showError("불러오기 실패", error);
        return;
      }
      renderGifts(data);
    }

    async function toggleChecked(gift) {
      const { error } = await sb
        .from("gifts")
        .update({ checked: !gift.checked })
        .eq("id", gift.id);

      if (error) {
        console.error("상태 변경 실패:", error.message, error.details, error.hint, error.code);
        showError("상태 변경 실패", error);
        return;
      }
      loadGifts();
    }

    giftForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const title = giftForm.title.value.trim();
      const price = giftForm.price.value.trim();
      if (!title) return;

      const { error } = await sb
        .from("gifts")
        .insert([{ title, price, checked: false }]);

      if (error) {
        console.error("추가 실패:", error.message, error.details, error.hint, error.code);
        showError("추가 실패", error);
        alert("추가 중 문제가 생겼어요. 콘솔을 확인해주세요.");
        return;
      }

      giftForm.reset();
      loadGifts();
    });

    loadGifts();
  </script>

</body>
</html>
